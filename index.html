<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>COISAS 3D - MultiPlayer Local Base</title>
    <style>
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #000; overflow: hidden; touch-action: none; 
            display: flex; justify-content: center; align-items: center; 
            color: white; font-family: Arial, sans-serif; 
        }
        canvas { width: 100%; height: 100%; object-fit: contain; }
        #status { position: absolute; z-index: 10; background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 5px; }
    </style>
    <script>
        // 1. INJEÇÃO BLINDADA DO SERVIDOR TURN (Sequestro WebRTC)
        // Isso força o núcleo WASM a usar o seu túnel Metered para atravessar o 4G.
        const OriginalRTC = window.RTCPeerConnection;
        window.RTCPeerConnection = function(config) {
            config = config || {};
            config.iceServers = [
                { urls: "stun:stun.relay.metered.ca:80" },
                { urls: "turn:standard.relay.metered.ca:80?transport=tcp", username: "a167bc8d42a6ccee918e9314", credential: "IEVQ8fMpOdhm/Z9w" },
                { urls: "turn:standard.relay.metered.ca:443", username: "a167bc8d42a6ccee918e9314", credential: "IEVQ8fMpOdhm/Z9w" },
                { urls: "turns:standard.relay.metered.ca:443?transport=tcp", username: "a167bc8d42a6ccee918e9314", credential: "IEVQ8fMpOdhm/Z9w" }
            ];
            return new OriginalRTC(config);
        };
    </script>
</head>
<body>
    <div id="status">Injetando ROM no Motor WebAssembly...</div>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

    <script>
        // 2. MAPEAMENTO DOS ARQUIVOS LOCAIS EXATOS
        const jogo = 'streetfighteralpha2.zip';
        const romUrl = 'roms/' + jogo;

        var Module = {
            canvas: document.getElementById('canvas'),
            arguments: ['/rom.zip'], // Diz ao núcleo para carregar a ROM no boot
            preRun: [],
            postRun: [],
            print: (text) => console.log(text),
            printErr: (text) => console.error(text)
        };

        // 3. O SISTEMA DE ARQUIVOS VIRTUAL (VFS)
        // O navegador não deixa o motor ler o disco C:, então baixamos a ROM
        // e gravamos na memória RAM (virtual) antes de ligar o motor do SNES.
        fetch(romUrl)
            .then(response => {
                if(!response.ok) throw new Error("ROM não encontrada na pasta roms.");
                return response.arrayBuffer();
            })
            .then(buffer => {
                Module.preRun.push(function() {
                    FS.writeFile('/rom.zip', new Uint8Array(buffer));
                    document.getElementById('status').style.display = 'none';
                });
                
                // Dispara a execução do motor local apenas após a ROM estar alocada
                const script = document.createElement('script');
                script.src = 'snes9x_libretro.js';
                document.body.appendChild(script);
            })
            .catch(err => {
                document.getElementById('status').innerText = "Erro Fatal: " + err.message;
            });
    </script>
</body>
</html>
