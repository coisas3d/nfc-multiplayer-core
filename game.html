<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Emulador - Cartucho NFC</title>
</head>
<body style="margin: 0; padding: 0; background-color: #000; overflow: hidden;">
    
    <div id="room-info" style="display: none; position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #0f0; padding: 10px 20px; border-radius: 8px; font-family: monospace; z-index: 9999; border: 1px solid #0f0; text-align: center;">
        SALA MULTIPLAYER<br>
        <span id="display-room-code" style="font-size: 24px; font-weight: bold; letter-spacing: 3px;"></span>
    </div>

    <div style="width: 100vw; height: 100vh; max-width: 100%; max-height: 100%;">
        <div id="game"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const jogo = urlParams.get('jogo');
        const roomCode = urlParams.get('room');
        const isHost = urlParams.get('isHost') === 'true';

        const mapeamentoConsoles = {
            'topgear': 'snes',
            'finalfight': 'snes',
            'cadillacs': 'arcade'
        };
        const consoleAtual = mapeamentoConsoles[jogo] || 'snes'; 

        window.EJS_player = '#game';
        window.EJS_core = consoleAtual;
        window.EJS_gameUrl = `roms/${jogo}.zip`; 
        window.EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/ethanaobrien/emulatorjs@main/data/';
        
        window.EJS_Buttons = {
            playPause: false, restart: false, mute: false, settings: true,
            fullscreen: false, saveState: false, loadState: false, screenRecord: false,
            gamepad: true, cheat: false, volume: false, saveSavFiles: false,
            loadSavFiles: false, quickSave: false, quickLoad: false, screenshot: false,
            cacheManager: false,
            netplay: true
        };

        if (roomCode) {
            window.EJS_netplayUrl = 'wss://nfc-server-osgz.onrender.com';
            window.EJS_netplayRoom = roomCode;
            
            document.getElementById('room-info').style.display = 'block';
            document.getElementById('display-room-code').innerText = roomCode;
        }
    </script>
    
    <script src="https://cdn.jsdelivr.net/gh/ethanaobrien/emulatorjs@main/data/loader.js"></script>
</body>
</html>
