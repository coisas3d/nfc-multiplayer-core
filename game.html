<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Emulador - Cartucho NFC Multiplayer</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; touch-action: none; }
        #game-container { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; align-items: center; }
        #game { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="game"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const jogo = urlParams.get('jogo') || 'streetfighteralpha2';

        const mapeamentoConsoles = {
            'streetfighteralpha2': 'snes',
            'topgear': 'snes',
            'cadillacs': 'arcade'
        };
        const consoleAtual = mapeamentoConsoles[jogo] || 'snes';

        window.EJS_player = '#game';
        window.EJS_core = consoleAtual;
        window.EJS_gameUrl = `roms/${jogo}.zip`;
        
        // A CHAVE DO MULTIPLAYER: Apontamento para a versão Nightly que possui o Netplay ativo
        window.EJS_pathtodata = 'https://cdn.emulatorjs.org/nightly/data/';

        window.EJS_Buttons = {
            playPause: false, restart: false, mute: false, settings: true,
            fullscreen: false, saveState: false, loadState: false, screenRecord: false,
            gamepad: true, cheat: false, volume: false, saveSavFiles: false,
            loadSavFiles: false, quickSave: false, quickLoad: false, screenshot: false,
            cacheManager: false,
            netplay: true
        };
    </script>
    
    <script src="https://cdn.emulatorjs.org/nightly/data/loader.js"></script>
</body>
</html>
