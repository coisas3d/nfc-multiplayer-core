<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Emulador - Cartucho NFC Multiplayer</title>
    <style>
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background-color: #000; 
            overflow: hidden; 
            touch-action: none; 
        }
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
        }
    </style>
</head>
<body>
    <script>
        // Captura o nome do jogo na URL
        const urlParams = new URLSearchParams(window.location.search);
        const jogo = urlParams.get('jogo') || 'streetfighteralpha2';

        // Mapeamento automático para o núcleo correto do WebRetro
        const mapeamentoCores = {
            'streetfighteralpha2': 'snes9x',
            'topgear': 'snes9x',
            'cadillacs': 'fbneo'
        };
        const core = mapeamentoCores[jogo] || 'snes9x';

        // Constrói a URL absoluta da ROM apontando para o repositório multiplayer correto
        const romUrl = `https://coisas3d.github.io/nfc-multiplayer-core/roms/${jogo}.zip`;

        // Aciona o motor WebRetro passando o sistema e injetando a sua ROM
        const webretroUrl = `https://webretro.github.io/webretro/?core=${core}&rom=${encodeURIComponent(romUrl)}`;

        // Cria a janela blindada que ocupará a tela do celular
        const iframe = document.createElement('iframe');
        iframe.src = webretroUrl;
        iframe.allow = "autoplay; gamepad; microphone";
        document.body.appendChild(iframe);
    </script>
</body>
</html>
